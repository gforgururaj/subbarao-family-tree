    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#0b0f1a;--surface:rgba(18,24,44,.88);--border:rgba(80,100,180,.22);--text:#e4e8f0;--dim:#7882a4;--male:#4da6ff;--female:#ff6fa0;--gold:#ffc94d;--accent:#9b7cf7;--couple:#ff9f43}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
        .hdr{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:linear-gradient(180deg,rgba(11,15,26,.96),transparent);backdrop-filter:blur(8px)}
        .hdr h1{font-size:1.15rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--female));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .ctrls{display:flex;gap:8px}
        .ctrls button,.ctrls a{background:var(--surface);color:var(--dim);border:1px solid var(--border);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.75rem;font-family:inherit;text-decoration:none;transition:all .2s}
        .ctrls button:hover,.ctrls a:hover{color:var(--text);border-color:var(--accent);background:rgba(155,124,247,.1)}
        #container{width:100vw;height:100vh}
        .tip{position:fixed;display:none;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;min-width:220px;max-width:300px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:200;backdrop-filter:blur(16px);font-size:.8rem}
        .tip.show{display:block}
        .tip h4{margin-bottom:6px}.tip .r{display:flex;justify-content:space-between;padding:2px 0}.tip .l{color:var(--dim)}.tip .v{font-weight:500}
        .tip hr{border:none;height:1px;background:var(--border);margin:6px 0}
        .stats{position:fixed;bottom:16px;right:20px;display:flex;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:.7rem;z-index:50;backdrop-filter:blur(8px)}
        .stats .sv{font-size:1rem;font-weight:700;color:var(--gold)}.stats .sl{color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-size:.55rem}
        .info{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:5px 16px;font-size:.65rem;color:var(--dim);z-index:50}
        .info kbd{background:rgba(255,255,255,.06);padding:1px 5px;border-radius:3px;border:1px solid rgba(255,255,255,.08);font-size:.62rem}
    </style>
</head>

const _STATIC_STATS   = {"total_members": 174, "generations": 5, "couples": 57};
const TIP=document.getElementById("tip");
let graph=null, memberLookup={};

let allRelationships=[], treeSpousePairs=new Set();

function init(){
    const allM=_STATIC_MEMBERS, allR=_STATIC_RELS, stats=_STATIC_STATS;
    allRelationships=allR;
    allM.forEach(m=>{memberLookup[m.id]=m});
    document.getElementById("stats").innerHTML=`<div><div class="sv">${stats.total_members}</div><div class="sl">Members</div></div><div><div class="sv">${stats.generations}</div><div class="sl">Generations</div></div><div><div class="sv">${stats.couples}</div><div class="sl">Couples</div></div>`;

    const treeRoot=buildHierarchy(allM,allR);
    const data=convertToG6(treeRoot);
    createGraph(data,allR);
}

function buildHierarchy(members,rels){
    const lk={};members.forEach(m=>{lk[m.id]={...m,children:[],_sp:false}});
    const placed=new Set();
    members.forEach(m=>{
        if(m.father_id&&lk[m.father_id]){lk[m.father_id].children.push(lk[m.id]);placed.add(m.id)}
        else if(m.mother_id&&lk[m.mother_id]){lk[m.mother_id].children.push(lk[m.id]);placed.add(m.id)}
    });
    treeSpousePairs=new Set();
    rels.forEach(r=>{
        const a=lk[r.partner1_id],b=lk[r.partner2_id];if(!a||!b)return;
        const pairKey=`${Math.min(r.partner1_id,r.partner2_id)}|${Math.max(r.partner1_id,r.partner2_id)}`;
        if(!placed.has(r.partner2_id)){
            b._sp=true;a.children.unshift(b);placed.add(r.partner2_id);
            treeSpousePairs.add(pairKey);
        }else if(!placed.has(r.partner1_id)){
            a._sp=true;b.children.unshift(a);placed.add(r.partner1_id);
            treeSpousePairs.add(pairKey);
        }
        // If both already placed (e.g. relatives who married), no tree embed —
        // a cross-edge will be added after render instead.
    });
    const roots=members.filter(m=>!placed.has(m.id)).map(m=>lk[m.id]);
    return roots.length===1?roots[0]:{id:"root",name:"Family",gender:"other",children:roots,_v:true};
}

function convertToG6(node){
    const genderColor={male:"#4da6ff",female:"#ff6fa0",other:"#6fd89a"};
    const c=genderColor[node.gender]||genderColor.other;
    const idLabel=node._v?"":"ID:"+node.id+" ";
    const item={
        id:String(node.id),
        label:idLabel+shortName(node.name),
        data:node,
        style:{stroke:c,lineWidth:2,fill:hexAlpha(c,0.08)},
        labelCfg:{style:{fill:"#e4e8f0",fontSize:10,fontWeight:600,fontFamily:"Inter"}},
    };
    if(node._sp){
        item.style.lineDash=[4,2];
        item.style.stroke="#ff9f43";
        item.style.fill="rgba(255,159,67,0.12)";
        item.edgeStyle={stroke:"#ff9f43",lineWidth:2,lineDash:[4,2],opacity:0.9};
    }
    if(node.children&&node.children.length>0){
        item.children=node.children.map(ch=>convertToG6(ch));
    }
    return item;
}

function hexAlpha(hex,a){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return`rgba(${r},${g},${b},${a})`;
}

function shortName(n){if(!n)return"";const m=n.match(/^([^(]+)/);return m?m[1].trim():n}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

function createGraph(data,allR){
    const W=window.innerWidth, H=window.innerHeight;
    graph=new G6.TreeGraph({
        container:"container",
        width:W,height:H,
        modes:{
            default:["drag-canvas","zoom-canvas","drag-node",{
                type:"collapse-expand",
                onChange(item,collapsed){
                    const d=item.getModel();d.collapsed=collapsed;
                    graph.layout();graph.fitView(40);
                    return true;
                }
            }]
        },
        defaultNode:{
            type:"rect",
            size:[148,32],
            anchorPoints:[[0,0.5],[1,0.5]],
            style:{radius:6,cursor:"pointer"}
        },
        defaultEdge:{
            type:"cubic-horizontal",
            style:{stroke:"#9b7cf7",lineWidth:2,opacity:0.9}
        },
        layout:{
            type:"compactBox",
            direction:"LR",
            getId:d=>d.id,
            getHeight:()=>32,
            getWidth:()=>148,
            getVGap:()=>2,
            getHGap:()=>60
        },
        fitView:true,
        fitViewPadding:[80,40,40,40],
        animate:true,
        animateCfg:{duration:350,easing:"easeCubic"}
    });

    graph.data(data);
    graph.render();
    graph.fitView(60);

    // Add dashed couple cross-edges for marriages where both members are
    // independently placed in the tree (e.g. relatives who married each other).
    // Skip pairs already connected by a tree-parent edge (treeSpousePairs).
    allR.forEach((r,i)=>{
        const pairKey=`${Math.min(r.partner1_id,r.partner2_id)}|${Math.max(r.partner1_id,r.partner2_id)}`;
        if(treeSpousePairs.has(pairKey))return; // already visually linked via tree edge
        const n1=graph.findById(String(r.partner1_id));
        const n2=graph.findById(String(r.partner2_id));
        if(n1&&n2){
            graph.addItem('edge',{
                id:`couple-${r.id}-${i}`,
                source:String(r.partner1_id),
                target:String(r.partner2_id),
                type:'quadratic',
                style:{stroke:'#ff9f43',lineWidth:2,lineDash:[5,3],opacity:0.9},
                label:'💕',
                labelCfg:{style:{fill:'#ff9f43',fontSize:10,background:{fill:'rgba(11,15,26,.8)',padding:[2,4,2,4],radius:3}}}
            });
        }
    });
    graph.fitView(60);

    graph.on("node:mouseenter",ev=>{
        const model=ev.item.getModel();
        const d=model.data;if(!d||d._v)return;
        let h=`<h4>${esc(d.name)}</h4><hr>`;
        if(d.dob)h+=`<div class="r"><span class="l">Born</span><span class="v">${d.dob}</span></div>`;
        if(d.dod)h+=`<div class="r"><span class="l">Died</span><span class="v">${d.dod}</span></div>`;
        if(d.spouse_name)h+=`<div class="r"><span class="l">Spouse</span><span class="v">💕 ${esc(d.spouse_name)}</span></div>`;
        if(d.father_name)h+=`<div class="r"><span class="l">Father</span><span class="v">${esc(d.father_name)}</span></div>`;
        if(d.mother_name)h+=`<div class="r"><span class="l">Mother</span><span class="v">${esc(d.mother_name)}</span></div>`;
        if(d.bio)h+=`<hr><div style="font-style:italic;color:var(--dim);font-size:.75rem">${esc(d.bio)}</div>`;
        TIP.innerHTML=h;TIP.classList.add("show");
        TIP.style.left=Math.min(ev.clientX+16,window.innerWidth-320)+"px";
        TIP.style.top=Math.min(ev.clientY+16,window.innerHeight-TIP.offsetHeight-20)+"px";
    });
    graph.on("node:mouseleave",()=>TIP.classList.remove("show"));
    graph.on("canvas:mousemove",()=>TIP.classList.remove("show"));

    document.getElementById("btn-fit").addEventListener("click",()=>graph.fitView(60));
    document.getElementById("btn-expand").addEventListener("click",()=>{
        graph.getNodes().forEach(n=>{const m=n.getModel();if(m.collapsed){m.collapsed=false}});
        graph.layout();graph.fitView(60);
    });
    document.getElementById("btn-collapse").addEventListener("click",()=>{
        const rootNode=graph.findById(data.id);
        if(rootNode){
            const rootModel=rootNode.getModel();
            function collapseChildren(id,depth){
                const nd=graph.findById(id);if(!nd)return;
                const model=nd.getModel();
                if(depth>=1&&model.children&&model.children.length){model.collapsed=true}
                if(model.children)model.children.forEach(c=>collapseChildren(c.id,depth+1));
            }
            collapseChildren(data.id,0);
            graph.layout();graph.fitView(60);
        }
    });

    window.addEventListener("resize",()=>{graph.changeSize(window.innerWidth,window.innerHeight);graph.fitView(60)});
}

init();
